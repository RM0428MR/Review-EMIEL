name: 🐛 不具合
description: 期待と違う動き・崩れ・エラー
title: "fix(<scope>): "
labels: ["type:fix"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 症状
      description: 何が起きているか
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される挙動
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 環境
      placeholder: |
        - ブラウザ: Chrome 130
        - OS: macOS 15
        - 端末幅: 1440 / 375
  - type: textarea
    id: notes
    attributes:
      label: メモ・スクショ
